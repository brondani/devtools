name: packchk
on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/packchk.yml'
      - '.github/workflows/unit_test_results.yml'
      - '.github/matrix_includes_packchk.json'
      - 'CMakeLists.txt'
      - 'tools/packchk/**'
      - 'libs/xml**'
      - 'libs/rte**'
      - 'external/cxxopts'
      - 'external/cxxopts.patch'
      - 'external/xerces-c'
      - 'external/xerces-c.patch'
      - '!**/docs/**/*'
      - '!**/*.md'
  pull_request:
    paths:
      - '.github/workflows/packchk.yml'
      - '.github/workflows/unit_test_results.yml'
      - '.github/matrix_includes_packchk.json'
      - 'CMakeLists.txt'
      - 'tools/packchk/**'
      - 'libs/xml**'
      - 'libs/rte**'
      - 'external/cxxopts'
      - 'external/cxxopts.patch'
      - 'external/xerces-c'
      - 'external/xerces-c.patch'
      - '!**/docs/**/*'
      - '!**/*.md'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: Open-CMSIS-Pack/devtools/.github/workflows/shared_setup_env.yml@main
    with:
      run_if: ${{ fromJSON((github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch') || (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/tools/packchk/')) || ((github.event.schedule != '') && (!github.event.repository.private))) }}

  matrix_prep:
    needs: setup
    uses: Open-CMSIS-Pack/devtools/.github/workflows/shared_matrix_prep.yml@main
    with:
      workflow_name: packchk

  build:
    needs: [ setup, matrix_prep ]
    runs-on: ${{ matrix.runs_on }}
    name: build (${{ matrix.runs_on }}, ${{ matrix.arch }})
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout devtools
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build packchk
        uses: Open-CMSIS-Pack/devtools-build-action@1f131b70796337c98d4f680632bb4135d90f17f0 # arm64
        with:
          target: packchkdist
          arch: ${{ matrix.arch }}

      - name: Archive packchk binary
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packchk-${{ matrix.target }}-${{ matrix.arch }}
          path: build/tools/packchk/packchk-*-${{ matrix.target }}-${{ matrix.arch }}.*
          retention-days: ${{ needs.setup.outputs.retention_days }}
          if-no-files-found: error

      - name: Install strip tools
        if: |
          github.event_name == 'release' &&
          matrix.arch == 'arm64' &&
          startsWith(matrix.runs_on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install binutils-aarch64-linux-gnu

      # Run only for release events on macOS or Ubuntu runners
      - name: Strip and bundle packchk release binary
        if: |
          github.event_name == 'release' &&
          (startsWith(matrix.runs_on, 'macos') || startsWith(matrix.runs_on, 'ubuntu'))
        shell: bash
        working-directory: build/tools/packchk/
        run: |
          mkdir -p packchk_release_bin

          # Extract the binary tarball into the release directory
          tar -xvf packchk-*-${{ matrix.target }}-${{ matrix.arch }}.tbz2 -C packchk_release_bin

          # Construct the path to the extracted binary
          binary_path="./packchk_release_bin/${{ matrix.binary }}"
          echo "Stripping binary at: $binary_path"

          # Use appropriate strip tool based on architecture and target
          if [[ "${{ matrix.arch }}" == "arm64" && "${{ matrix.target }}" == "linux" ]]; then
            aarch64-linux-gnu-strip "$binary_path"
          else
            strip "$binary_path"
          fi

          # Temporarily rename the original archive
          original_filename=$(find . -maxdepth 1 -type f -name "packchk-*-${{ matrix.target }}-${{ matrix.arch }}.tbz2" | head -n 1)
          mv "$original_filename" ./temp.tbz2

          # Repack the modified binary into a new tarball
          output_name=$(basename "$original_filename")
          echo "Repacking into: $output_name"
          tar -cjf "$output_name" -C packchk_release_bin .

      - name: Attach zipped binary to the release
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@81c65b7cd4de9b2570615ce3aad67a41de5b1a13 # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          file: build/tools/packchk/packchk-*-${{ matrix.target }}-${{ matrix.arch }}.*

  test:
    needs: [ setup, matrix_prep ]
    runs-on: ${{ matrix.runs_on }}
    name: test (${{ matrix.runs_on }}, ${{ matrix.arch }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout devtools
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build PackChkUnitTests
        uses: Open-CMSIS-Pack/devtools-build-action@1f131b70796337c98d4f680632bb4135d90f17f0 # arm64
        with:
          arch: ${{ matrix.arch }}
          build_type: Debug
          target: PackChkUnitTests

      - name: Run packchk unit tests
        if: matrix.arch != 'arm64'
        run: |
          ctest -V -R PackChkUnitTests
        working-directory: ./build

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build PackChkIntegTests
        uses: Open-CMSIS-Pack/devtools-build-action@1f131b70796337c98d4f680632bb4135d90f17f0 # arm64
        with:
          arch: ${{ matrix.arch }}
          build_type: Debug
          target: PackChkIntegTests

      - name: Run packchk integ tests
        if: matrix.arch != 'arm64'
        run: |
          ctest -V -R PackChkIntegTests
        working-directory: ./build

      - name: Archive unit test results
        if: always() && (matrix.arch != 'arm64')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit_test_result_packchk-${{ matrix.target }}-${{ matrix.arch }}
          path: ./build/test_reports/packchkunittests-*.xml
          if-no-files-found: error
          retention-days: ${{ needs.setup.outputs.retention_days }}

      - name: Archive integration test results
        if: always() && (matrix.arch != 'arm64')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integ_test_result_packchk-${{ matrix.target }}-${{ matrix.arch }}
          path: ./build/test_reports/packchkintegtests-*.xml
          if-no-files-found: error
          retention-days: ${{ needs.setup.outputs.retention_days }}

  release:
    if: |
        github.event_name == 'release' &&
        startsWith(github.ref, 'refs/tags/tools/packchk/')
    needs: [ build, test ]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout devtools
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Create distribution folders
        run: |
          mkdir -p tools/packchk/distribution/

  test-results-preparation:
    name: "Publish Tests Results"
    needs: [ test ]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Event File
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Event File packchk
          path: ${{ github.event_path }}
